# Alternative DigitalOcean App Platform Konfiguration
# Kopiere diese Datei zu app.yaml und passe sie an deine Bedürfnisse an

spec:
  name: aivatar-character-creator
  region: fra
  
  services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
      branch: main
      deploy_on_push: true
    
    build_command: npm run build
    run_command: npm run start
    
    environment_slug: node-js
    
    instance_count: 1
    instance_size_slug: basic-xxs
    
    http_port: 8080
    
    routes:
    - path: /
    
    health_check:
      http_path: /
    
    envs:
    - key: NODE_ENV
      scope: RUN_TIME
      value: "production"
    
    - key: VITE_SUPABASE_URL
      scope: BUILD_AND_RUN_TIME
      value: "${VITE_SUPABASE_URL}"
    
    - key: VITE_SUPABASE_PUBLISHABLE_KEY
      scope: BUILD_AND_RUN_TIME
      value: "${VITE_SUPABASE_PUBLISHABLE_KEY}"
    
    - key: VITE_SUPABASE_PROJECT_ID
      scope: BUILD_AND_RUN_TIME
      value: "${VITE_SUPABASE_PROJECT_ID}"

  alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
