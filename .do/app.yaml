name: aivatar-character-creator
region: fra
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile.nginx
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: VITE_SUPABASE_URL
        scope: BUILD_TIME
        value: ${VITE_SUPABASE_URL}
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        scope: BUILD_TIME
        value: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      - key: VITE_SUPABASE_PROJECT_ID
        scope: BUILD_TIME
        value: ${VITE_SUPABASE_PROJECT_ID}
